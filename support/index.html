<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>产品应用与技术支持 - MaxCINE</title>

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#f5f5f5;
      color:#111;
    }

    .mc-header {
      background:#fff;
      border-bottom:1px solid #eee;
      height:60px;
      display:flex;
      align-items:center;
      padding:0 20px;
    }

    .mc-left {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .mc-logo { height:24px; }

    .mc-container {
      max-width:900px;
      margin:0 auto;
      padding:60px 20px;
      text-align:center;
    }

    .mc-search {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:20px;
    }

    .mc-input {
      padding:12px;
      width:280px;
      border:1px solid #ddd;
      border-radius:8px;
    }

    .mc-btn {
      padding:12px 20px;
      background:#111;
      color:#fff;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

    .mc-main {
      display:none;
      margin-top:20px;
    }

    .mc-img {
      width:120px;
      height:120px;
      object-fit:contain;
      margin:20px auto;
      background:#fff;
      border-radius:12px;
      border:1px solid #eee;
    }

    .mc-card {
      background:#fff;
      margin-top:20px;
      padding:20px;
      border-radius:12px;
      text-align:left;
    }

    .download-btn {
      display:block;
      padding:12px;
      margin-top:12px;
      background:#111;
      color:#fff;
      border-radius:8px;
      text-decoration:none;
      text-align:center;
    }
  </style>
</head>

<body>

<div class="mc-header">
  <div class="mc-left">
    <img src="../assets/logo2.png" class="mc-logo">
    <div>产品应用与技术支持</div>
  </div>
</div>

<div class="mc-container">

  <h1>技术支持与售后服务</h1>
  <p style="color:#666;">请输入设备序列号以获取专属支持</p>

  <div class="mc-search">
    <input id="sn-input" class="mc-input" placeholder="请输入序列号">
    <button id="sn-btn" class="mc-btn">验证</button>
  </div>

  <div id="main" class="mc-main">

    <!-- 产品 -->
    <img id="img" class="mc-img">
    <h2 id="name"></h2>

    <!-- 售后 -->
    <div class="mc-card">

  <h3 style="margin-bottom:16px;">售后服务</h3>

  <!-- ⭐ 主按钮（放最明显） -->
  <a id="repair-link" class="download-btn primary-btn" target="_blank" style="pointer-events:none; opacity:0.5;">
    🔧 自助寄修服务
  </a>

  <!-- 分割 -->
  <div style="margin:24px 0; height:1px; background:#eee;"></div>

  <!-- 联系 -->
  <div style="text-align:center;">

    <p style="font-size:14px; color:#666; margin-bottom:16px;">
      或联系技术顾问获取支持
    </p>

    <!-- 横向排列（关键优化点） -->
    <div style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">

      <!-- 微信 -->
      <div style="text-align:center;">
        <img src="../assets/wechat.jpg" style="width:120px; border-radius:8px;">
        <div style="font-size:12px; color:#888; margin-top:6px;">微信</div>
      </div>

     <a id="wa-link" class="wa-btn" target="_blank">
  <span class="wa-icon">🟢</span>
  WhatsApp 联系
     </a>

    </div>

  </div>

</div>
<script>
const btn = document.getElementById("sn-btn");
const input = document.getElementById("sn-input");
const main = document.getElementById("main");

const img = document.getElementById("img");
const name = document.getElementById("name");

btn.onclick = async () => {

  const sn = input.value.trim();
  if (!sn) return alert("请输入序列号");

  try {
    const res = await fetch("../data/" + sn + ".json?t=" + Date.now());
    if (!res.ok) throw new Error();

    const data = await res.json();

    // 产品名
    name.textContent = data.version;

    // ===== 产品图（严格按 JSON）=====
    if (data.image && data.image.includes(".")) {
      const path = "../assets/products/" + data.image + "?t=" + Date.now();
      console.log("加载图片:", path);

      img.src = path;

      img.onerror = () => {
        console.error("图片失败:", path);
        img.src = "../assets/products/default.png";
      };
    } else {
      img.src = "../assets/products/default.png";
    }

    // ===== 寄修 =====
    const repair = document.getElementById("repair-link");
    repair.href = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAN__6qx3slUNzRSVDJUQUk0VUFYUThHWEpETEJVU1dIMS4u";
    repair.style.pointerEvents = "auto";
    repair.style.opacity = "1";

    // ===== WhatsApp =====
    const phone = "6593537378"; // 必须纯数字
    const text = encodeURIComponent("Hello, SN: " + sn);

    document.getElementById("wa-link").href =
      `https://wa.me/${phone}?text=${text}`;

    main.style.display = "block";

  } catch {
    alert("序列号无效");
  }
};
</script>

</body>
</html>
