<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>售后服务政策 - MaxCINE</title>

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#f5f5f5;
      color:#111;
    }

    .mc-header {
      background:#fff;
      border-bottom:1px solid #eee;
      height:60px;
      display:flex;
      align-items:center;
      padding:0 20px;
    }

    .mc-left {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .mc-logo { height:24px; }

    .mc-container {
      max-width:900px;
      margin:0 auto;
      padding:60px 20px;
    }

    .mc-card {
      background:#fff;
      padding:24px;
      border-radius:12px;
      margin-bottom:20px;
      line-height:1.8;
    }

    h1 {
      text-align:center;
      margin-bottom:10px;
    }

    .sub {
      text-align:center;
      color:#666;
      margin-bottom:30px;
    }

  </style>
</head>

<body>

<!-- header（完全一致） -->
<div class="mc-header">
  <div class="mc-left">
    <img src="../assets/logo2.png" class="mc-logo">
    <div>售后服务政策</div>
  </div>
</div>

<div class="mc-container">

  <h1>售后服务政策</h1>
  <p class="sub">了解您的产品保修范围与服务流程</p>

  <div class="mc-card">

    <h3>一、保修范围</h3>
    <p>
      产品在正常使用情况下出现的非人为质量问题，可享受保修服务。
    </p>

    <h3>二、保修期限</h3>
    <p>
      保修周期自设备激活之日起计算，具体以系统记录为准。
    </p>

    <h3>三、不在保修范围</h3>
    <p>
      • 人为损坏（跌落、撞击等）<br>
      • 进水或极端环境损坏<br>
      • 非官方拆解或改装<br>
      • 超出保修期限
    </p>

    <h3>四、维修流程</h3>
    <p>
      提交申请 → 审核 → 寄回检测 → 维修处理 → 寄回用户
    </p>

    <h3>五、技术支持</h3>
    <p>
      用户可通过联系技术顾问或自助寄修系统获取支持服务。
    </p>

  </div>

</div>

</body>
</html>
