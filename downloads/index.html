<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品下载中心 - MaxCINE</title>

  <link rel="stylesheet" href="../styles.css">

  <style>
  body {
    background: #f5f5f5;
    color: #111;
  }

  /* 卡片 */
  .dl-card,
  .dl-item {
    background: #fff;
    border: 1px solid #eee;
  }

  /* 输入框 */
  .dl-input-group input {
    background: #fff;
    color: #111;
    border: 1px solid #ddd;
  }

  /* ✅ 修复按钮（重点） */
  .dl-input-group button {
    background: #111 !important;
    color: #fff !important;
    border-radius: 10px;
  }

  .dl-input-group button:hover {
    opacity: 0.85;
  }

  /* 下载按钮 */
  .dl-item a {
    background: #111;
    color: #fff;
  }

  /* 产品信息 */
  #product img {
    width: 120px;
    border-radius: 12px;
    border: 1px solid #eee;
    background: #fff;
    padding: 10px;
    margin-bottom: 12px;
  }

  #product h2 {
    font-size: 22px;
    margin-bottom: 10px;
  }
  </style>

</head>

<body>

<header class="mc-header">
  <div class="mc-header-inner">
    <a href="/" class="mc-logo">
      <img src="../assets/logo2.png">
    </a>
  </div>
</header>

<div class="dl-wrap">

  <div class="dl-hero">
    <h1>资源下载</h1>
    <p>输入设备序列号以解锁专属资源</p>
  </div>

  <div class="dl-card">
    <h3>设备验证</h3>
    <div class="dl-sub">请输入序列号</div>

    <div class="dl-input-group">
      <input id="sn-input" placeholder="SN CODE">
      <button id="sn-btn">验证</button>
    </div>
  </div>

  <!-- ✅ 产品信息 -->
  <div id="content" class="dl-content">

    <div id="product" style="text-align:center; margin-bottom:40px;">
      <img id="img">
      <h2 id="name"></h2>
    </div>

    <div class="dl-grid">

      <div class="dl-item">
        <h4>Photoshop CameraRaw</h4>
        <a href="./ps/maxcine_ps_v1.zip" download>下载</a>
      </div>

      <div class="dl-item">
        <h4>Lightroom</h4>
        <a href="./ps/maxcine_lr_v1.zip" download>下载</a>
      </div>

      <div class="dl-item">
        <h4>DaVinci DRX</h4>
        <a href="./ps/maxcine_davinci_v1.zip" download>下载</a>
      </div>

    </div>

  </div>

</div>

<script>
const btn = document.getElementById("sn-btn");
const input = document.getElementById("sn-input");
const content = document.getElementById("content");

const img = document.getElementById("img");
const name = document.getElementById("name");

btn.onclick = async () => {

  const sn = input.value.trim();

  if (!sn) {
    alert("请输入序列号");
    return;
  }

  btn.innerText = "验证中...";

  try {
    const res = await fetch("../data/" + sn + ".json?t=" + Date.now());

    if (!res.ok) throw new Error();

    const data = await res.json();

    // ✅ 显示产品信息
    name.textContent = data.version;
    img.src = "../assets/products/" + data.image;

    img.onerror = () => {
      img.src = "../assets/products/default.png";
    };

    btn.innerText = "✔ 已验证";

    setTimeout(() => {
      content.style.display = "block";
    }, 300);

  } catch {
    btn.innerText = "验证失败";
    setTimeout(() => {
      btn.innerText = "验证";
    }, 1500);
  }
};
</script>

</body>
</html>
