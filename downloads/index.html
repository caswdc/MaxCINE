<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品下载中心 - MaxCINE</title>

  <!-- ✅ 关键：引入你的全局样式 -->
  <link rel="stylesheet" href="../styles.css">
<style>
body {
  background: #f5f5f5;
  color: #111;
}

/* 卡片 */
.dl-card,
.dl-item {
  background: #fff;
  border: 1px solid #eee;
}

/* 输入框 */
.dl-input-group input {
  background: #fff;
  color: #111;
  border: 1px solid #ddd;
}

/* 下载按钮 */
.dl-item a {
  background: #111;
  color: #fff;
}
</style>
</head>

<body>

<!-- ✅ Header（和主站统一） -->
<header class="mc-header">
  <div class="mc-header-inner">
    <a href="/" class="mc-logo">
      <img src="../assets/logo2.png">
    </a>
  </div>
</header>

<!-- 主体 -->
<div class="dl-wrap">

  <!-- 标题 -->
  <div class="dl-hero">
    <h1>资源下载</h1>
    <p>输入设备序列号以解锁专属资源</p>
  </div>

  <!-- 验证卡片 -->
  <div class="dl-card">

    <h3>设备验证</h3>
    <div class="dl-sub">请输入序列号</div>

    <div class="dl-input-group">
      <input id="sn-input" placeholder="SN CODE">
      <button id="sn-btn">验证</button>
    </div>

  </div>

  <!-- 下载内容 -->
  <div id="content" class="dl-content">

    <div class="dl-grid">

      <div class="dl-item">
        <h4>Photoshop CameraRaw</h4>
        <a href="./ps/maxcine_ps_v1.zip" download>下载</a>
      </div>

      <div class="dl-item">
        <h4>Lightroom</h4>
        <a href="./ps/maxcine_lr_v1.zip" download>下载</a>
      </div>

      <div class="dl-item">
        <h4>DaVinci DRX</h4>
        <a href="./ps/maxcine_davinci_v1.zip" download>下载</a>
      </div>

    </div>

  </div>

</div>

<script>
const btn = document.getElementById("sn-btn");
const input = document.getElementById("sn-input");
const content = document.getElementById("content");

btn.onclick = async () => {

  const sn = input.value.trim();

  if (!sn) {
    alert("请输入序列号");
    return;
  }

  btn.innerText = "验证中...";

  try {
    const res = await fetch("../data/" + sn + ".json?t=" + Date.now());

    if (!res.ok) throw new Error();

    const data = await res.json();

    // 成功动画
    btn.innerText = "✔ 已验证";

    setTimeout(() => {
      content.style.display = "block";
    }, 300);

  } catch {
    btn.innerText = "验证失败";
    setTimeout(() => {
      btn.innerText = "验证";
    }, 1500);
  }
};
</script>

</body>
</html>
