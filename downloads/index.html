<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品下载中心 - MaxCINE</title>

  <style>
    body {
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
      background:#f5f5f5;
      color:#111;
    }

    /* Header */
    .mc-header {
      background:#fff;
      border-bottom:1px solid #eee;
      height:60px;
      display:flex;
      align-items:center;
      padding:0 20px;
    }

    .mc-left {
      display:flex;
      align-items:center;
      gap:12px;
    }

    .mc-logo {
      height:24px;
    }

    .mc-nav-text {
      font-size:18px;
      font-weight:500;
      height:24px;
      display:flex;
      align-items:center;
      color:#222;
    }

    /* Main */
    .mc-container {
      max-width:900px;
      margin:0 auto;
      padding:60px 20px;
      text-align:center;
    }

    h1 {
      font-size:28px;
      margin-bottom:10px;
    }

    .mc-desc {
      color:#666;
      margin-bottom:30px;
      font-size:14px;
    }

    /* 输入 */
    .mc-search {
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:20px;
    }

    .mc-input {
      padding:12px;
      width:280px;
      border:1px solid #ddd;
      border-radius:8px;
      font-size:14px;
    }

    .mc-input:focus {
      outline:none;
      border-color:#000;
      box-shadow:0 0 0 3px rgba(0,0,0,0.08);
    }

    .mc-btn {
      padding:12px 20px;
      border:none;
      background:#111;
      color:#fff;
      border-radius:8px;
      cursor:pointer;
    }

    /* loading */
    #loading {
      display:none;
      margin-top:20px;
    }

    .mc-loader {
      width:32px;
      height:32px;
      border:3px solid #ddd;
      border-top:3px solid #111;
      border-radius:50%;
      margin:0 auto;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 结果 */
    .mc-main {
      display:none;
      margin-top:20px;
    }

    .mc-img {
      width:140px;
      height:140px;
      margin:20px auto;
      object-fit:contain;
      background:#fff;
      border-radius:12px;
      border:1px solid #eee;
    }

    .mc-card {
      background:white;
      margin-top:30px;
      padding:24px;
      border-radius:12px;
      text-align:left;
    }

    .download-btn {
      display:block;
      padding:12px;
      margin-top:12px;
      background:#111;
      color:#fff;
      border-radius:8px;
      text-decoration:none;
      text-align:center;
    }

    .download-btn:hover {
      opacity:0.85;
    }
  </style>
</head>

<body>

<!-- Header -->
<div class="mc-header">
  <div class="mc-left">
    <img src="../assets/logo2.png" class="mc-logo">
    <div class="mc-nav-text">产品下载中心</div>
  </div>
</div>

<div class="mc-container">

  <h1>资源下载</h1>
  <div class="mc-desc">输入设备序列号以解锁专属资源</div>

  <!-- 输入 -->
  <div class="mc-search">
    <input id="sn-input" class="mc-input" placeholder="请输入序列号">
    <button id="sn-btn" class="mc-btn">验证</button>
  </div>

  <!-- loading -->
  <div id="loading">
    <div class="mc-loader"></div>
  </div>

  <!-- 结果 -->
  <div id="main" class="mc-main">

    <img id="img" class="mc-img">

    <h2 id="name"></h2>

    <div class="mc-card">

      <p>该设备已通过验证，可下载专属资源</p>

<a href="../assets/downloads/ps/maxcine_ps_v1.zip" download>
<a href="../assets/downloads/ps/maxcine_lr_v1.zip" download>
<a href="../assets/downloads/ps/maxcine_davinci_v1.zip" download>
</a>
    </div>

  </div>

</div>

<script>
const btn = document.getElementById("sn-btn");
const input = document.getElementById("sn-input");
const loading = document.getElementById("loading");
const main = document.getElementById("main");

const img = document.getElementById("img");
const name = document.getElementById("name");

main.style.display = "none";

btn.onclick = async () => {

  const sn = input.value.trim();

  if (!sn) {
    alert("请输入序列号");
    return;
  }

  loading.style.display = "block";
  main.style.display = "none";

  try {
    const res = await fetch("../data/" + sn + ".json?t=" + Date.now());

    if (!res.ok) throw new Error();

    const data = await res.json();

    name.textContent = data.version;

    // ⭐ 正确图片路径
    img.src = "assets/products/" + data.image;

    img.onerror = () => {
      img.src = "assets/products/default.png";
    };

    loading.style.display = "none";
    main.style.display = "block";

  } catch {
    loading.style.display = "none";
    alert("序列号无效");
  }
};
</script>

</body>
</html>
